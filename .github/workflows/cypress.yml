name: Cypress

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the dev branch
on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - main
      - dev

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  cypress:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [16]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Checkout
        uses: actions/checkout@v4
      # Plain commands instead of cypress-io/github-action, which fails early
      # on the current runners ("Socket closed before the connection was established").
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Start dev server
        run: yarn start > dev-server.log 2>&1 &
      - name: Wait for dev server
        # The app is served under the "homepage" path from package.json.
        # 127.0.0.1 avoids "localhost" resolving to IPv6 while the server listens on IPv4.
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/aeons-end-randomizer/ > /dev/null; then
              echo "Dev server is up"; exit 0
            fi
            sleep 5
          done
          echo "Dev server did not start"; cat dev-server.log; exit 1
      - name: Cypress run
        run: yarn cypress run --config baseUrl=http://127.0.0.1:3000/aeons-end-randomizer/
