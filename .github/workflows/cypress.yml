name: Cypress

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the dev branch
on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - main
      - dev

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  cypress:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [16]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          start: yarn start
          # Use 127.0.0.1: newer Node resolves "localhost" to IPv6 (::1),
          # but the dev server only listens on IPv4.
          # The app is served under the "homepage" path from package.json.
          wait-on: 'http://127.0.0.1:3000/aeons-end-randomizer/'
          # wait for 4 minutes for the server to respond
          wait-on-timeout: 240
          config: baseUrl=http://127.0.0.1:3000/aeons-end-randomizer/
